# values-vault-production.yaml
#
# Apply the vault-internal-ca-and-cert.yaml (or vault-tls-certificate.yaml
# for a public cert) BEFORE installing/upgrading Vault with these values,
# since server.extraVolumes references the Secret cert-manager creates.
#
# Fill in <KMS_KEY_ID> and <VAULT_IAM_ROLE_ARN> from the Terraform outputs:
#   terraform output kms_key_id
#   terraform output vault_iam_role_arn

global:
  enabled: true

server:
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "<VAULT_IAM_ROLE_ARN>"   # from terraform output vault_iam_role_arn

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 0
          tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        seal "awskms" {
          region     = "us-east-1"
          kms_key_id = "<KMS_KEY_ID>"   # from terraform output kms_key_id
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: gp3

  extraVolumes:
    - type: secret
      name: vault-tls        # matches secretName in the cert-manager Certificate

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    initialDelaySeconds: 60

ui:
  enabled: true
  serviceType: ClusterIP   # keep internal; front with your own Ingress + auth if needed

injector:
  enabled: true
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m
